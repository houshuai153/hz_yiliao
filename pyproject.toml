[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioanalysis-ai-platform"
version = "0.1.0"
description = "生物分析业务 AI 效能平台（工程原型，使用模拟数据）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "streamlit>=1.37",
    "requests>=2.31",
    "numpy>=1.26",
    "python-docx>=1.1",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-socket>=0.7", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --allow-hosts=127.0.0.1,::1 --allow-unix-socket"
