# 受控出网代理（仅在 docker-compose.llm.yml 里启用）：api 容器经它访问大模型服务，且只能访问下面这一个主机的 443 端口。
# - 只放行 HTTPS CONNECT 隧道：TLS 在 api 与对方之间端到端建立，代理看不到请求内容，也不持有 LLM_API_KEY。
# - 访问日志在容器内 /var/log/squid/access.log（tmpfs，重启即清；只含目标主机与结果，不含内容）。
# - 其它主机、其它端口、普通 HTTP 请求、非 CONNECT 方法一律拒绝；不缓存；不转发客户端地址。
# - 要换成别的模型服务：同时改这里的 dstdomain 与 .env 里的 LLM_BASE_URL（两处必须一致）。
http_port 3128

acl llm_host dstdomain api.deepseek.com
acl tls_port port 443
acl tunnel method CONNECT

http_access deny !tunnel
http_access deny !tls_port
http_access allow llm_host
http_access deny all

cache deny all
forwarded_for delete
request_header_access X-Forwarded-For deny all
access_log stdio:/var/log/squid/access.log
cache_log stdio:/var/log/squid/cache.log
pid_filename /tmp/squid.pid
